name: Build and Push to Docker

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  # Integration tests use TestContainers (a real Postgres in Docker), so they cannot run inside the
  # image build (no Docker-in-Docker). They run here on the runner, where Docker is available, and
  # gate the image builds below. Lint, build and unit tests run inside the Dockerfiles.
  integration_tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
    - name: Setup checkout
      uses: actions/checkout@v4

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate clients
      run: npm run generate

    - name: Integration tests
      run: npm run test:int

  build_main:
    needs: integration_tests
    runs-on: ubuntu-latest

    steps:
    - name: Setup checkout
      uses: actions/checkout@v4

    - name: Setup buildx
      uses: docker/setup-buildx-action@v3.10.0

    - name: Build
      uses: docker/build-push-action@v6.18.0
      with:
        cache-from: type=gha,scope=main
        cache-to: type=gha,scope=main,mode=max
        tags: pangostack-local
        outputs: type=docker,dest=/tmp/pangostack-local.tar

    # The image is only pushed after the e2e tests passed, so it is handed over as an artifact.
    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: pangostack-local
        path: /tmp/pangostack-local.tar
        retention-days: 1

  build_worker:
    needs: integration_tests
    runs-on: ubuntu-latest

    steps:
    - name: Setup checkout
      uses: actions/checkout@v4

    - name: Setup buildx
      uses: docker/setup-buildx-action@v3.10.0

    - name: Build
      uses: docker/build-push-action@v6.18.0
      with:
        file: ./worker/Dockerfile
        cache-from: type=gha,scope=worker
        cache-to: type=gha,scope=worker,mode=max
        tags: pangostack-worker-local
        outputs: type=docker,dest=/tmp/pangostack-worker-local.tar

    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: pangostack-worker-local
        path: /tmp/pangostack-worker-local.tar
        retention-days: 1

  # Black-box tests against the freshly built images, see docs/e2e-testing-concept.md.
  e2e_tests:
    needs: [build_main, build_worker]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e

    steps:
    - name: Setup checkout
      uses: actions/checkout@v4

    - name: Download images
      uses: actions/download-artifact@v4
      with:
        pattern: pangostack-*
        path: /tmp/images
        merge-multiple: true

    - name: Load images
      run: |
        docker load --input /tmp/images/pangostack-local.tar
        docker load --input /tmp/images/pangostack-worker-local.tar

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: e2e/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate clients
      run: npm run generate

    - name: Install browsers
      run: npx playwright install --with-deps chromium

    - name: Start environment
      run: npm run infra:up

    - name: API tests
      run: npm run test:api

    - name: UI tests
      run: npm run test:ui

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: e2e/playwright-report
        retention-days: 7

    - name: Dump logs
      if: failure()
      run: npm run infra:logs > compose-logs.txt

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compose-logs
        path: e2e/compose-logs.txt
        retention-days: 7

  publish:
    needs: e2e_tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Calculate Version
      env:
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        echo "BUILD_NUMBER=$(($BUILD_NUMBER))" >> $GITHUB_ENV

    - name: Download images
      uses: actions/download-artifact@v4
      with:
        pattern: pangostack-*
        path: /tmp/images
        merge-multiple: true

    - name: Load images
      run: |
        docker load --input /tmp/images/pangostack-local.tar
        docker load --input /tmp/images/pangostack-worker-local.tar

    - name: Login to Docker Hub
      uses: docker/login-action@v3.0.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Rename Tags
      run: |
        docker tag pangostack-local squidex/pangostack-dev
        docker tag pangostack-local squidex/pangostack-dev:${{ env.BUILD_NUMBER }}
        docker tag pangostack-worker-local squidex/pangostack-worker-dev
        docker tag pangostack-worker-local squidex/pangostack-worker-dev:${{ env.BUILD_NUMBER }}

    - name: Push Tags
      run: |
        docker push squidex/pangostack-dev
        docker push squidex/pangostack-dev:${{ env.BUILD_NUMBER }}
        docker push squidex/pangostack-worker-dev
        docker push squidex/pangostack-worker-dev:${{ env.BUILD_NUMBER }}
