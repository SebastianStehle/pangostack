name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe your use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Pangostack solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
