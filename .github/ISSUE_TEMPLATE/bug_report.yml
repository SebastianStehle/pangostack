name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and include error messages or logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a service with the definition below
        2. Deploy it
        3. ...
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Deployment definition
      description: The relevant part of your definition. Remove all secrets first.
      render: yaml
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Portal / admin UI
        - Deployments and workflows
        - Resource provisioning (worker)
        - Billing
        - Login
        - Installation / hosting
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Docker image tag or git commit.
