# The test environment for the e2e suites. It runs the images built by CI (or locally with `npm run infra:build`).
name: pangostack-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pango
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: pango
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pango']
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/temporal:1.4.1
    command: ['server', 'start-dev', '--ip', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'localhost:7233']
      interval: 2s
      timeout: 5s
      retries: 30

  # The deploy target for docker-compose-ssh: an SSH server with its own Docker daemon.
  docker-target:
    build: ./docker-target
    privileged: true
    healthcheck:
      test: ['CMD-SHELL', 'docker info > /dev/null 2>&1 && nc -z localhost 22']
      interval: 2s
      timeout: 5s
      retries: 30

  # Serves the compose files that the docker-compose-ssh resource downloads.
  fixtures:
    image: nginx:1.29-alpine
    volumes:
      - ./definitions/compose:/usr/share/nginx/html/compose:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost/compose/busybox.yml']
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    image: ${WORKER_IMAGE:-pangostack-worker-local}
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3100/api-json > /dev/null']
      interval: 2s
      timeout: 5s
      retries: 60

  pango:
    image: ${PANGO_IMAGE:-pangostack-local}
    environment:
      AUTH_ENABLE_PASSWORD: 'true'
      AUTH_INITIAL_USER_API_KEY: e2e-api-key
      AUTH_INITIAL_USER_EMAIL: admin@pango.test
      AUTH_INITIAL_USER_PASSWORD: e2e-Secret1
      BILLING_TYPE: none
      DB_URL: postgres://pango:secret@postgres:5432/pango?sslmode=disable
      SESSION_SECRET: e2e-session-secret
      URLS_BASEURL: https://localhost:8443
      URLS_BASEUIURL: https://localhost:8443
      WORKER_ENDPOINT: http://worker:3100
      WORKFLOW_STEP_MAX_ATTEMPTS: '1'
      WORKFLOW_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      worker:
        condition: service_healthy
      docker-target:
        condition: service_healthy
      fixtures:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/health > /dev/null']
      interval: 2s
      timeout: 5s
      retries: 90

  # Production cookies are secure, so the app must be served over HTTPS like behind a real ingress.
  proxy:
    image: caddy:2.10-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '8443:443'
    depends_on:
      pango:
        condition: service_healthy
