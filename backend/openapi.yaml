info:
  title: Pangostack
  description: SaaS Deployment Tool
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    AuthProviderDto:
      type: object
      properties:
        name:
          type: string
          description: The unique name.
        displayName:
          type: string
          description: The display name.
        color:
          type: string
          description: The color.
      required:
        - name
        - displayName
        - color
    AuthSettingsDto:
      type: object
      properties:
        providers:
          description: Indicates which auth providers are enabled.
          type: array
          items:
            $ref: "#/components/schemas/AuthProviderDto"
        enablePasswordAuth:
          type: boolean
          description: Indicates if password authentication is enabled.
      required:
        - providers
        - enablePasswordAuth
    ProfileDto:
      type: object
      properties:
        id:
          type: string
          description: The user ID from the auth provider.
        name:
          type: string
          description: The display name.
        email:
          type: string
          description: The email address.
        picture:
          type: string
          description: The URL to an external picture.
          nullable: true
        isAdmin:
          type: boolean
          description: Indicates if the user is an admin.
        notifoApiKey:
          type: string
          description: The api key for notifo.
          nullable: true
        notifoUrl:
          type: string
          description: The URL for notifo.
          nullable: true
      required:
        - id
        - name
        - email
        - picture
        - isAdmin
        - notifoApiKey
        - notifoUrl
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: The email address.
        password:
          type: string
          description: The password.
      required:
        - email
        - password
    ActivityUserDto:
      type: object
      properties:
        id:
          type: string
          description: The user ID from the auth provider.
        name:
          type: string
          description: The display name.
        email:
          type: string
          description: The email address.
      required:
        - id
        - name
        - email
    ActivityDto:
      type: object
      properties:
        id:
          type: number
          description: The ID of the activity.
        key:
          type: string
          description: The key that identifies the type of the activity.
        text:
          type: string
          description: The already translated, human readable text of the activity.
        deploymentId:
          type: number
          description: The ID of the deployment the activity relates to, or null for team
            wide activities.
          nullable: true
        createdAt:
          type: string
          description: The date the activity has been logged.
          format: date-time
        createdBy:
          description: The user that caused the activity, or null for system activities.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityUserDto"
      required:
        - id
        - key
        - text
        - deploymentId
        - createdAt
        - createdBy
    ActivitiesDto:
      type: object
      properties:
        items:
          description: The activities.
          type: array
          items:
            $ref: "#/components/schemas/ActivityDto"
        total:
          type: number
          description: The total number of activities.
      required:
        - items
        - total
    LabeledValueDto:
      type: object
      properties:
        value:
          type: string
          description: The value, for example a connection URL or an image version.
        isPublic:
          type: boolean
          description: Whether this value is publicly visible to the customer.
        label:
          type: string
          description: Human-readable label for the value.
      required:
        - value
        - isPublic
        - label
    AvailableUpdateDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the version.
      required:
        - name
    DeploymentResourceDto:
      type: object
      properties:
        id:
          type: string
          description: The ID of the resource.
        name:
          type: string
          description: The name of the resource.
      required:
        - id
        - name
    DeploymentDto:
      type: object
      properties:
        id:
          type: number
          description: The ID of the deployment.
        name:
          type: string
          description: The name of the deployment.
          nullable: true
        serviceId:
          type: number
          description: The ID of the service.
        serviceName:
          type: string
          description: The name of the service.
        serviceVersion:
          type: string
          description: The version of the service.
        isVersionDefault:
          type: boolean
          description: Indicates if the version is the default one.
        isVersionLast:
          type: boolean
          description: " Indicates if the version is the last one."
        createdAt:
          type: string
          description: The timestamp when the deployment has been created.
          format: date
        connections:
          type: object
          description: The connection infos organized by connection type and name.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/LabeledValueDto"
        afterInstallationInstructions:
          type: object
          description: Instructions to follow after installation.
          nullable: true
        status:
          type: string
          description: The current status of the last deployment update.
          enum:
            - Pending
            - Running
            - Completed
            - Failed
        healthStatus:
          type: string
          description: The current health status of the deployment.
          nullable: true
          enum:
            - Succeeded
            - Failed
        parameters:
          type: object
          description: The current deployment parameters.
          additionalProperties: true
        resources:
          description: The current resources.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentResourceDto"
        availableUpdates:
          description: The available updates.
          type: array
          items:
            $ref: "#/components/schemas/AvailableUpdateDto"
      required:
        - id
        - name
        - serviceId
        - serviceName
        - serviceVersion
        - isVersionDefault
        - isVersionLast
        - createdAt
        - connections
        - afterInstallationInstructions
        - status
        - healthStatus
        - parameters
        - resources
        - availableUpdates
    DeploymentsDto:
      type: object
      properties:
        items:
          description: The deployments.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentDto"
        total:
          type: number
          description: The total number of deployments.
      required:
        - items
        - total
    UpdateDeploymentDto:
      type: object
      properties:
        name:
          type: string
          description: The optional name to describe the deployment.
          nullable: true
          maxLength: 100
        versionId:
          type: number
          description: The ID of the version when an update is made.
          nullable: true
        parameters:
          type: object
          description: The parameters.
          additionalProperties: true
      required:
        - name
        - versionId
        - parameters
    ResourceNodeStatusDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the node.
        isReady:
          type: boolean
          description: Indicates if the node can be used.
        message:
          type: string
          description: The message to describe the status.
          nullable: true
      required:
        - name
        - isReady
        - message
    ResourceWorkloadStatusDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the workload.
        nodes:
          description: All nodes within the workload.
          type: array
          items:
            $ref: "#/components/schemas/ResourceNodeStatusDto"
      required:
        - name
        - nodes
    ResourceStatusDto:
      type: object
      properties:
        resourceId:
          type: string
          description: The resource I.
        resourceType:
          type: string
          description: The type of the resource.
        resourceName:
          type: string
          description: The name of the resource.
        workloads:
          description: The workflows that have been create.
          type: array
          items:
            $ref: "#/components/schemas/ResourceWorkloadStatusDto"
        properties:
          type: object
          description: Runtime properties collected live from the resource, for example
            the deployed image version.
          additionalProperties:
            $ref: "#/components/schemas/LabeledValueDto"
      required:
        - resourceId
        - resourceType
        - resourceName
        - workloads
        - properties
    DeploymentStatusDto:
      type: object
      properties:
        resources:
          description: The resource.
          type: array
          items:
            $ref: "#/components/schemas/ResourceStatusDto"
      required:
        - resources
    DeploymentStepLogDto:
      type: object
      properties:
        message:
          type: string
          description: The log line.
        timestamp:
          format: date-time
          type: string
          description: When the line was reported.
      required:
        - message
        - timestamp
    DeploymentSubStepDto:
      type: object
      properties:
        id:
          type: number
          description: The id of the sub-step.
        name:
          type: string
          description: The name of the sub-step.
        status:
          type: string
          description: The status of the sub-step.
          enum:
            - Pending
            - Running
            - Completed
            - Failed
        error:
          type: string
          description: The error, when the sub-step failed.
          nullable: true
        logs:
          description: The timestamped log lines reported for this sub-step.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentStepLogDto"
        startedAt:
          format: date-time
          type: string
          description: When the sub-step was started.
          nullable: true
        completedAt:
          format: date-time
          type: string
          description: When the sub-step was completed or failed.
          nullable: true
      required:
        - id
        - name
        - status
        - error
        - logs
        - startedAt
        - completedAt
    DeploymentStepDto:
      type: object
      properties:
        resourceId:
          type: string
          description: The ID of the resource within the service definition.
        resourceName:
          type: string
          description: The display name of the resource.
        action:
          type: string
          description: Whether the resource is deployed or deleted in this step.
          enum:
            - Deploy
            - Delete
        status:
          type: string
          description: The status of the step.
          enum:
            - Pending
            - Running
            - Completed
            - Failed
        attempt:
          type: number
          description: The current attempt, greater than one when the step has been retried.
        maxAttempts:
          type: number
          description: The maximum number of attempts.
        error:
          type: string
          description: The error of the last failed attempt.
          nullable: true
        subSteps:
          description: The sub-steps as reported by the worker.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentSubStepDto"
        logs:
          description: The timestamped log lines reported outside any sub-step.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentStepLogDto"
        startedAt:
          format: date-time
          type: string
          description: When the step was started.
          nullable: true
        completedAt:
          format: date-time
          type: string
          description: When the step was completed or failed.
          nullable: true
      required:
        - resourceId
        - resourceName
        - action
        - status
        - attempt
        - maxAttempts
        - error
        - subSteps
        - logs
        - startedAt
        - completedAt
    DeploymentStepsDto:
      type: object
      properties:
        steps:
          description: The steps of the most recent deployment update.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentStepDto"
      required:
        - steps
    ResourceInstanceLogDto:
      type: object
      properties:
        instanceId:
          type: string
          description: The identifier for instances or kubernetes deployments.
        messages:
          type: string
          description: The actual log message.
      required:
        - instanceId
        - messages
    ResourceLogsDto:
      type: object
      properties:
        resourceId:
          type: string
          description: The resource I.
        resourceType:
          type: string
          description: The type of the resource.
        resourceName:
          type: string
          description: The name of the resource.
        instances:
          description: The logs for the instances.
          type: array
          items:
            $ref: "#/components/schemas/ResourceInstanceLogDto"
      required:
        - resourceId
        - resourceType
        - resourceName
        - instances
    DeploymentLogsDto:
      type: object
      properties:
        resources:
          description: The resource.
          type: array
          items:
            $ref: "#/components/schemas/ResourceLogsDto"
      required:
        - resources
    DeploymentCheckSummaryDto:
      type: object
      properties:
        date:
          type: string
          description: The date for which the summary has been create.
        totalFailures:
          type: number
          description: The total number of failures on this dat.
        totalSuccesses:
          type: number
          description: The total number of successes on this dat.
      required:
        - date
        - totalFailures
        - totalSuccesses
    DeploymentCheckSummariesDto:
      type: object
      properties:
        checks:
          description: The summary per dat.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentCheckSummaryDto"
      required:
        - checks
    DeploymentUsageSummaryDto:
      type: object
      properties:
        date:
          type: string
          description: The date for which the summary has been create.
        totalCores:
          type: number
          description: The total cores at the specified dat.
        totalMemoryGB:
          type: number
          description: The total memory at the specified date (in GB.
        totalVolumeGB:
          type: number
          description: The total volume at the specified date (in GB.
        totalStorageGB:
          type: number
          description: The total storage at the specified date (in GB.
      required:
        - date
        - totalCores
        - totalMemoryGB
        - totalVolumeGB
        - totalStorageGB
    DeploymentUsageSummariesDto:
      type: object
      properties:
        summaries:
          description: The usage summary per dat.
          type: array
          items:
            $ref: "#/components/schemas/DeploymentUsageSummaryDto"
      required:
        - summaries
    DeploymentMetricSummaryDto:
      type: object
      properties:
        label:
          type: string
          description: The display label of the summary.
        type:
          type: string
          description: How the values are aggregated.
          enum:
            - avg
            - max
        prefix:
          type: string
          description: The mapping prefix that the summary is based on.
        value:
          type: string
          description: The optional value name to select a single value under the prefix.
          nullable: true
      required:
        - label
        - type
        - prefix
        - value
    DeploymentMetricDatapointDto:
      type: object
      properties:
        timestamp:
          type: string
          description: The timestamp when the metric has been collected.
        values:
          type: object
