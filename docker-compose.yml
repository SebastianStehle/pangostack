services:
  pangostack:
    image: "pangostack-local:latest"
    environment:
      - AUTH_GOOGLE_CLIENTID=${AUTH_GOOGLE_CLIENTID}
      - AUTH_GOOGLE_CLIENTSECRET=${AUTH_GOOGLE_CLIENTSECRET}
      - AUTH_BASEURL=https://localhost:3333
      - AUTH_INITIAL_USER_EMAIL=admin
      - AUTH_INITIAL_USER_PASSWORD=secret
      - DB_URL=postgres://admin:secret@host.docker.internal:5010/pango?sslmode=disable
    ports:
      - "3333:3000"
